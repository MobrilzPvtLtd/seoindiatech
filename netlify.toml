[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Canonical host: apex → www (HTTPS)
[[redirects]]
  from = "https://seoindiatech.com/*"
  to = "https://www.seoindiatech.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://seoindiatech.com/*"
  to = "https://www.seoindiatech.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.seoindiatech.com/*"
  to = "https://www.seoindiatech.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
