[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Canonical host: apex → www (HTTPS)
[[redirects]]
  from = "https://seoindiatech.com/*"
  to = "https://www.seoindiatech.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://seoindiatech.com/*"
  to = "https://www.seoindiatech.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.seoindiatech.com/*"
  to = "https://www.seoindiatech.com/:splat"
  status = 301
  force = true

# URL aliases — explicit 301 (Next.js plugin may emit 308 otherwise)
[[redirects]]
  from = "/contactus"
  to = "/contact-us"
  status = 301
  force = true

[[redirects]]
  from = "/services/woocommerce-seo"
  to = "/services/e-commerce-seo"
  status = 301
  force = true

[[redirects]]
  from = "/services/seo-web-design"
  to = "/services/ui-ux-design"
  status = 301
  force = true

[[redirects]]
  from = "/locations/noida"
  to = "/seo-services/seo-services-in-noida"
  status = 301
  force = true

[[redirects]]
  from = "/locations/delhi"
  to = "/seo-services/seo-services-in-delhi"
  status = 301
  force = true

# Trailing slash removal (paths only; homepage stays /)
[[redirects]]
  from = "/:path/"
  to = "/:path"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
