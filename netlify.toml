[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

[build.processing.html]
  pretty_urls = false

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Canonical host: apex → www (HTTPS)
[[redirects]]
  from = "https://seoindiatech.com/*"
  to = "https://www.seoindiatech.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://seoindiatech.com/*"
  to = "https://www.seoindiatech.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.seoindiatech.com/*"
  to = "https://www.seoindiatech.com/:splat"
  status = 301
  force = true

# URL aliases — explicit 301 (Next.js plugin may emit 308 otherwise)
[[redirects]]
  from = "/contactus"
  to = "/contact-us"
  status = 301
  force = true

[[redirects]]
  from = "/services/woocommerce-seo"
  to = "/services/e-commerce-seo"
  status = 301
  force = true

[[redirects]]
  from = "/services/seo-web-design"
  to = "/services/ui-ux-design"
  status = 301
  force = true

[[redirects]]
  from = "/locations/noida"
  to = "/seo-services/seo-services-in-noida"
  status = 301
  force = true

[[redirects]]
  from = "/locations/delhi"
  to = "/seo-services/seo-services-in-delhi"
  status = 301
  force = true

# Root public files → /images/* (Netlify CDN serves nested public assets reliably)
[[redirects]]
  from = "/robots.txt"
  to = "/images/site/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/images/site/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/llms.txt"
  to = "/images/site/llms.txt"
  status = 200
  force = true

[[redirects]]
  from = "/agents.json"
  to = "/images/site/agents.json"
  status = 200
  force = true

[[redirects]]
  from = "/agent-instructions.md"
  to = "/images/site/agent-instructions.md"
  status = 200
  force = true

[[redirects]]
  from = "/sit-transparent.png"
  to = "/images/brand/sit-transparent.png"
  status = 200
  force = true

[[redirects]]
  from = "/favicon.ico"
  to = "/images/brand/favicon.png"
  status = 200
  force = true

# Trailing slash canonicalization handled in next.config.mjs (avoids redirect loops with Next plugin)

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
